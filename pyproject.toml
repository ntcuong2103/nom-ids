[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nom-ids"
version = "0.1.0"
description = "Nom character IDS recognition training utilities."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "einops>=0.8.1,<0.9",
    "numpy>=1.26.4,<2",
    "pillow>=11.3,<12",
    "pytorch-lightning>=2.5.2,<2.6",
    "torch>=2.7.1,<2.8",
    "torchmetrics>=1.7.4,<2",
    "torchvision>=0.22.1,<0.23",
    "wandb>=0.23,<0.24",
]


[dependency-groups]
dev = [
    "ipykernel>=6.26,<7",
    "jupyter>=1,<2",
]

[tool.setuptools]
py-modules = [
    "data",
    "extract_data",
    "lit_trainer",
    "trainer",
    "trie_search",
]
packages = ["model"]

[tool.uv]
package = true
